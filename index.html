
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Christmas Dream</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#02040a;color:white;
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
#scene{position:fixed;inset:0}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.header{
  position:absolute;top:23px;width:100%;text-align:center;
  color:#ead3a0;letter-spacing:5px;text-shadow:0 0 22px #d4a65c;
}
.header h1{
  font-family:Georgia,serif;font-size:clamp(22px,5vw,37px);
  font-weight:400;margin:0 0 8px;
}
.header p{
  font:10px "Malgun Gothic",sans-serif;
  letter-spacing:4px;color:#b5a98d;margin:0;
}
#status{
  position:absolute;top:91px;width:100%;text-align:center;
  font:11px "Malgun Gothic",sans-serif;color:#c2b69c;
  letter-spacing:1px;padding:0 12px;
}
.controls{
  position:absolute;bottom:20px;left:0;width:100%;
  display:flex;justify-content:center;gap:7px;flex-wrap:wrap;
  padding:0 8px;pointer-events:auto;
}
.control{
  border:1px solid rgba(220,190,125,.55);color:#ead8ae;
  background:rgba(5,10,15,.85);border-radius:30px;
  padding:10px 13px;font-family:"Malgun Gothic",sans-serif;
  font-size:11px;cursor:pointer;backdrop-filter:blur(8px);
}
.control:active{background:#604b2c}

#modal{
  position:fixed;inset:0;z-index:10;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);backdrop-filter:blur(12px);
  padding:18px;
}
.panel{
  position:relative;width:min(420px,100%);max-height:88vh;
  overflow-y:auto;padding:34px 23px;text-align:center;
  border:1px solid rgba(218,181,108,.6);
  background:linear-gradient(145deg,#17231d,#080c12);
  box-shadow:0 0 70px rgba(195,151,74,.2);
}
.panel h2{
  font-family:"Malgun Gothic",sans-serif;font-size:23px;
  font-weight:400;letter-spacing:2px;color:#e6cb91;
  margin:10px 0 20px;
}
.panel p{
  font-family:"Malgun Gothic",sans-serif;font-size:14px;
  line-height:2;color:#e2dccd;white-space:pre-line;
}
.panel input{
  width:190px;padding:13px;text-align:center;letter-spacing:8px;
  font-size:23px;color:#f2d99d;background:#080d0e;
  border:1px solid #9f814a;outline:none;margin:15px auto;
}
.action{
  display:block;width:100%;max-width:260px;
  margin:12px auto 0;padding:13px 20px;
  background:linear-gradient(110deg,#8a6938,#e1c58a,#8a6938);
  color:#16130d;border:0;letter-spacing:1px;cursor:pointer;
  font-family:"Malgun Gothic",sans-serif;font-size:13px;
}
.secondary{
  background:transparent;color:#c5b38d;
  border:1px solid #76613e;
}

/* 照片保存按钮 */
#savePhotoBtn{
  background:linear-gradient(110deg,#80602f,#f0d69b,#a17a3d);
  color:#17120a;
  font-weight:bold;
  box-shadow:0 0 20px rgba(218,181,108,.2);
}
#savePhotoBtn:disabled{
  opacity:.65;
  cursor:wait;
}
#saveHint{
  color:#c5b38d;
  font-size:11px;
  margin-top:12px;
  line-height:1.8;
}

#close{
  position:absolute;right:13px;top:10px;background:none;border:0;
  color:#cbb88e;font-size:25px;cursor:pointer;z-index:2;
}
#giftPhoto{
  display:block;width:100%;max-height:45vh;
  object-fit:contain;margin:15px auto;
  border:1px solid rgba(220,190,125,.3);
}
.photo-missing{
  padding:35px 12px;border:1px dashed rgba(220,190,125,.4);
  color:#c5b38d;font-size:13px;line-height:2;
}
#cameraVideo{
  position:fixed;width:1px;height:1px;opacity:0;
  pointer-events:none;left:-10px;top:-10px;
}
@media(max-width:500px){
  .header{top:20px}
  .control{padding:9px 10px;font-size:10px}
  .panel{padding:30px 18px}
}
</style>
</head>

<body>

<div id="scene"></div>

<div id="ui">
  <div class="header">
    <h1>CHRISTMAS DREAM</h1>
    <p>소원이 이루어지는 작은 세상</p>
  </div>

  <div id="status">
    반짝이는 별빛이 모이고 있어요 · 크리스마스의 세계에 오신 것을 환영합니다
  </div>

  <div class="controls">
    <button class="control" id="musicBtn">♫ 피아노 음악 재생</button>
    <button class="control" id="scatterBtn">✧ 입자 흩뿌리기</button>
    <button class="control" id="cameraBtn">◎ 손동작 켜기</button>
    <button class="control" id="resetBtn">↻ 시점 초기화</button>
  </div>
</div>

<!-- 礼物弹窗 -->
<div id="modal">
  <div class="panel">
    <button id="close">×</button>

    <!-- 第一步：生日验证 -->
    <div id="stepBirthday">
      <h2>생일 인증</h2>
      <p>생일의 월과 일을 입력해 주세요.<br>예: 3월 14일은 0314를 입력해 주세요.</p>
      <input id="birthdayInput" inputmode="numeric" maxlength="4" placeholder="MMDD">
      <button class="action" id="verifyBtn">선물 확인하기</button>
      <p id="errorText" style="color:#d78b7c;font-size:12px"></p>
    </div>

    <!-- 第二步：祝福语 -->
    <div id="stepGreeting" style="display:none">
      <h2 id="greetingTitle">A LITTLE WISH</h2>
      <p id="greetingText"></p>
      <button class="action" id="nextBtn">다음</button>
    </div>

    <!-- 第三步：礼物照片 -->
    <div id="stepPhoto" style="display:none">
      <h2 id="photoTitle">A GIFT FOR YOU</h2>

      <div id="photoContent"></div>

      <button class="action" id="savePhotoBtn">
        ↓ 사진을 휴대폰에 저장하기
      </button>

      <p id="saveHint">
        소중한 선물을 휴대폰에 간직하세요 ♡
      </p>

      <button class="action secondary" id="finishBtn">닫기</button>
    </div>
  </div>
</div>

<!-- 圣诞音乐 -->
<audio id="christmasMusic" loop preload="auto">
  <source src="./christmas-joy.mp3" type="audio/mpeg">
</audio>

<video id="cameraVideo" autoplay playsinline muted></video>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* 1. 四份礼物资料 */

const giftsData=[
  {
    birthday:"0612",
    name:"아빠",
    greeting:"🎄 아빠, 메리 크리스마스!\n항상 건강하시고 평안하시며, 모든 일이 순조롭게 이루어지길 바라요!\n\n영원히 사랑하는 영영 올림",
    title:"🎄 아빠",
    image:"./gifts/gift1.jpg"
  },
  {
    birthday:"1218",
    name:"엄마",
    greeting:"🎁 엄마, 메리 크리스마스!\n언제나 젊고 아름다우시고, 평안과 기쁨이 가득하시길 바라요!\n\n영원히 사랑하는 영영 올림",
    title:"🎄 엄마",
    image:"./gifts/gift2.jpg"
  },
  {
    birthday:"0316",
    name:"창윤",
    greeting:"🎄 사랑하는 창윤아, 메리 크리스마스!\n우리 서로 사랑하며 행복하게, 해마다 함께하길 바라!\n\n영원히 사랑하는 영영 올림",
    title:"🎄 창윤",
    image:"./gifts/gift3.jpg"
  },
  {
    birthday:"0916",
    name:"상윤",
    greeting:"상윤, 메리 크리스마스! 🎄\n멋지고 돈도 많은 사람이 돼서 돈 걱정 없이 여유롭고 행복하게 지내길 바라요.\n\n영원히 사랑하는 영영 올림",
    title:"🎄 상윤",
    image:"./gifts/gift4.jpg"
  }
];


/* 2. THREE 场景 */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02040a);
scene.fog=new THREE.FogExp2(0x02040a,.014);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,150);
camera.position.set(0,4.7,17);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById("scene").appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x87958e,1.2));

const warmLight=new THREE.PointLight(0xffd69a,75,35);
warmLight.position.set(-5,8,7);
scene.add(warmLight);

const greenLight=new THREE.PointLight(0x1b8060,60,30);
greenLight.position.set(6,4,-4);
scene.add(greenLight);

const goldLight=new THREE.PointLight(0xe6b45c,45,25);
goldLight.position.set(0,2,6);
scene.add(goldLight);


/* 3. 纯粒子圣诞树 */

const tree=new THREE.Group();
scene.add(tree);

const particleCount=20000;
const treePositions=new Float32Array(particleCount*3);
const scatteredPositions=new Float32Array(particleCount*3);
const particleColors=new Float32Array(particleCount*3);

const palette=[
  new THREE.Color(0x063d2b),
  new THREE.Color(0x087448),
  new THREE.Color(0x159565),
  new THREE.Color(0x9b763b),
  new THREE.Color(0xe6c783),
  new THREE.Color(0x6b8e69)
];

for(let i=0;i<particleCount;i++){
  const k=i*3;
  const height=1.2+Math.random()*9;
  const progress=(height-1.2)/9;
  const maxRadius=(1-progress)*3.25;
  const radius=maxRadius*(.42+Math.random()*.58);
  const angle=Math.random()*Math.PI*2+progress*18;

  treePositions[k]=Math.cos(angle)*radius;
  treePositions[k+1]=height;
  treePositions[k+2]=Math.sin(angle)*radius;

  scatteredPositions[k]=(Math.random()-.5)*19;
  scatteredPositions[k+1]=Math.random()*16-1;
  scatteredPositions[k+2]=(Math.random()-.5)*17;

  let color;
  const r=Math.random();

  if(r<.67)color=palette[Math.floor(Math.random()*3)];
  else if(r<.9)color=palette[3+Math.floor(Math.random()*2)];
  else color=palette[4];

  color=color.clone().multiplyScalar(.72+Math.random()*.45);

  particleColors[k]=color.r;
  particleColors[k+1]=color.g;
  particleColors[k+2]=color.b;
}

const treeGeometry=new THREE.BufferGeometry();
treeGeometry.setAttribute("position",new THREE.BufferAttribute(treePositions.slice(),3));
treeGeometry.setAttribute("color",new THREE.BufferAttribute(particleColors,3));

const treeMaterial=new THREE.PointsMaterial({
  size:.055,
  vertexColors:true,
  transparent:true,
  opacity:.95,
  depthWrite:false,
  blending:THREE.AdditiveBlending
});

const treeParticles=new THREE.Points(treeGeometry,treeMaterial);
tree.add(treeParticles);


/* 金色星尘 */

const dustCount=2500;
const dustPositions=new Float32Array(dustCount*3);
const dustColors=new Float32Array(dustCount*3);

for(let i=0;i<dustCount;i++){
  const k=i*3;
  const y=1+Math.random()*10;
  const r=3.1+Math.random()*1.8;
  const a=Math.random()*Math.PI*2;

  dustPositions[k]=Math.cos(a)*r;
  dustPositions[k+1]=y;
  dustPositions[k+2]=Math.sin(a)*r;

  const c=new THREE.Color().setHSL(.1+Math.random()*.08,.7,.55);
  dustColors[k]=c.r;
  dustColors[k+1]=c.g;
  dustColors[k+2]=c.b;
}

const dustGeo=new THREE.BufferGeometry();
dustGeo.setAttribute("position",new THREE.BufferAttribute(dustPositions,3));
dustGeo.setAttribute("color",new THREE.BufferAttribute(dustColors,3));

const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({
  size:.045,
  vertexColors:true,
  transparent:true,
  opacity:.65,
  blending:THREE.AdditiveBlending,
  depthWrite:false
}));

tree.add(dust);


/* 树顶星星 */

const starShape=new THREE.Shape();

for(let i=0;i<10;i++){
  const a=i*Math.PI/5-Math.PI/2;
  const r=i%2===0?.48:.21;
  const x=Math.cos(a)*r;
  const y=Math.sin(a)*r;

  if(i===0)starShape.moveTo(x,y);
  else starShape.lineTo(x,y);
}

starShape.closePath();

const star=new THREE.Mesh(
  new THREE.ShapeGeometry(starShape),
  new THREE.MeshBasicMaterial({color:0xffe5a1,side:THREE.DoubleSide})
);

star.position.y=10.55;
tree.add(star);

const starGlow=new THREE.PointLight(0xffd58b,38,9);
starGlow.position.set(0,10.5,0);
tree.add(starGlow);

const baseRing=new THREE.Mesh(
  new THREE.TorusGeometry(3.3,.018,8,120),
  new THREE.MeshBasicMaterial({color:0xc59c59,transparent:true,opacity:.75})
);

baseRing.rotation.x=Math.PI/2;
baseRing.position.y=.15;
tree.add(baseRing);


/* 4. 星空 */

const starsCount=1800;
const starsPos=new Float32Array(starsCount*3);

for(let i=0;i<starsCount;i++){
  starsPos[i*3]=(Math.random()-.5)*65;
  starsPos[i*3+1]=(Math.random()-.5)*45;
  starsPos[i*3+2]=(Math.random()-.5)*55;
}

const starsGeo=new THREE.BufferGeometry();
starsGeo.setAttribute("position",new THREE.BufferAttribute(starsPos,3));

const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({
  color:0xe8e1d2,
  size:.045,
  transparent:true,
  opacity:.8
}));

scene.add(stars);


/* 5. 六边形冰晶雪花 */

const snowGroup=new THREE.Group();
scene.add(snowGroup);

function createHexSnowTexture(){
  const canvas=document.createElement("canvas");
  canvas.width=256;
  canvas.height=256;

  const ctx=canvas.getContext("2d");
  const cx=128,cy=128;

  const glow=ctx.createRadialGradient(cx,cy,5,cx,cy,120);
  glow.addColorStop(0,"rgba(255,255,255,0.55)");
  glow.addColorStop(.35,"rgba(190,235,255,0.28)");
  glow.addColorStop(1,"rgba(130,200,255,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,256,256);

  ctx.save();
  ctx.translate(cx,cy);
  ctx.shadowColor="#b8eaff";
  ctx.shadowBlur=20;
  ctx.strokeStyle="rgba(245,252,255,1)";
  ctx.lineWidth=4;
  ctx.lineJoin="round";

  ctx.beginPath();
  for(let i=0;i<6;i++){
    const angle=i*Math.PI/3-Math.PI/2;
    const x=Math.cos(angle)*73;
    const y=Math.sin(angle)*73;
    if(i===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.shadowBlur=12;
  ctx.lineWidth=2.5;
  ctx.strokeStyle="rgba(170,225,255,.95)";
  ctx.beginPath();

  for(let i=0;i<6;i++){
    const angle=i*Math.PI/3-Math.PI/2;
    const x=Math.cos(angle)*43;
    const y=Math.sin(angle)*43;
    if(i===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.closePath();
  ctx.stroke();

  for(let i=0;i<6;i++){
    ctx.save();
    ctx.rotate(i*Math.PI/3);
    ctx.strokeStyle="rgba(255,255,255,1)";
    ctx.lineWidth=4;
    ctx.lineCap="round";
    ctx.shadowColor="#c9efff";
    ctx.shadowBlur=15;

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(0,-108);
    ctx.stroke();

    for(let j=0;j<3;j++){
      const y=-34-j*24;
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(-18,y-18);
      ctx.moveTo(0,y);
      ctx.lineTo(18,y-18);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(0,-108);
    ctx.lineTo(-10,-94);
    ctx.moveTo(0,-108);
    ctx.lineTo(10,-94);
    ctx.stroke();

    ctx.restore();
  }

  ctx.shadowColor="#ffffff";
  ctx.shadowBlur=25;
  ctx.fillStyle="#ffffff";
  ctx.beginPath();
  ctx.arc(0,0,9,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  return new THREE.CanvasTexture(canvas);
}

const snowTexture=createHexSnowTexture();
const snowColors=[0xffffff,0xc9eaff,0xe8f5ff,0xfff2d9];
const snowData=[];

for(let i=0;i<115;i++){
  const material=new THREE.SpriteMaterial({
    map:snowTexture,
    color:snowColors[Math.floor(Math.random()*snowColors.length)],
    transparent:true,
    opacity:.78+Math.random()*.22,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  const flake=new THREE.Sprite(material);
  const size=.18+Math.random()*.32;

  flake.scale.set(size,size,1);
  flake.position.set(
    (Math.random()-.5)*25,
    Math.random()*23-1,
    (Math.random()-.5)*18
  );

  snowGroup.add(flake);

  snowData.push({
    speed:.012+Math.random()*.025,
    drift:.003+Math.random()*.012,
    spin:(Math.random()-.5)*.018,
    phase:Math.random()*6.28
  });
}


/* 6. 四个礼物盒 */

const gifts=new THREE.Group();
scene.add(gifts);

const giftStyles=[
  {name:"아빠",color:0x641c2c,ribbon:0xe1c17d,size:1.25},
  {name:"엄마",color:0x124532,ribbon:0xd4b46c,size:.88},
  {name:"창윤",color:0xb99457,ribbon:0xf1e1bd,size:1.12},
  {name:"상윤",color:0x77658f,ribbon:0xe6d7f2,size:.95}
];

const giftObjects=[];

function makeGift(index,x,z,rotation){
  const style=giftStyles[index];
  const size=style.size;
  const group=new THREE.Group();

  group.position.set(x,.08,z);
  group.rotation.y=rotation;
  group.userData.giftIndex=index;

  const boxMat=new THREE.MeshStandardMaterial({
    color:style.color,
    roughness:.36,
    metalness:.18
  });

  const ribbonMat=new THREE.MeshStandardMaterial({
    color:style.ribbon,
    roughness:.27,
    metalness:.65
  });

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(size,size*.76,size),
    boxMat
  );

  body.position.y=size*.38;
  group.add(body);

  [-1,1].forEach(side=>{
    const sideRibbon=new THREE.Mesh(
      new THREE.BoxGeometry(size*.018,size*.78,size*.15),
      ribbonMat
    );

    sideRibbon.position.set(side*(size/2+.012),size*.39,0);
    group.add(sideRibbon);
  });

  const hinge=new THREE.Group();
  hinge.position.set(0,size*.76,-size*.49);
  group.add(hinge);

  const lid=new THREE.Mesh(
    new THREE.BoxGeometry(size*1.08,size*.18,size*1.08),
    boxMat
  );

  lid.position.set(0,size*.09,size*.49);
  hinge.add(lid);

  [-1,1].forEach(side=>{
    const lidSideRibbon=new THREE.Mesh(
      new THREE.BoxGeometry(size*.018,size*.19,size*.15),
      ribbonMat
    );

    lidSideRibbon.position.set(
      side*(size*1.08/2+.012),
      size*.09,
      size*.49
    );

    hinge.add(lidSideRibbon);
  });

  if(index===3){
    const decoration=new THREE.Mesh(
      new THREE.OctahedronGeometry(size*.18),
      ribbonMat
    );

    decoration.position.set(0,size*.27,0);
    group.add(decoration);
  }else{
    const bow1=new THREE.Mesh(
      new THREE.TorusGeometry(size*.17,size*.045,8,24),
      ribbonMat
    );

    bow1.position.set(-size*.13,size*.25,0);
    bow1.scale.set(1,.7,.55);
    group.add(bow1);

    const bow2=bow1.clone();
    bow2.position.x=size*.13;
    group.add(bow2);

    const knot=new THREE.Mesh(
      new THREE.SphereGeometry(size*.075,14,14),
      ribbonMat
    );

    knot.position.y=size*.25;
    group.add(knot);
  }

  if(index===2){
    const pearlMaterial=new THREE.MeshStandardMaterial({
      color:0xfff1d4,
      metalness:.25,
      roughness:.15
    });

    for(let j=0;j<8;j++){
      const pearl=new THREE.Mesh(
        new THREE.SphereGeometry(.035,10,10),
        pearlMaterial
      );

      const a=j/8*Math.PI*2;

      pearl.position.set(
        Math.cos(a)*size*.43,
        size*.42,
        Math.sin(a)*size*.43
      );

      group.add(pearl);
    }
  }

  const labelCanvas=document.createElement("canvas");
  labelCanvas.width=640;
  labelCanvas.height=200;

  const ctx=labelCanvas.getContext("2d");
  ctx.clearRect(0,0,640,200);
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="#f6d68e";
  ctx.shadowBlur=22;
  ctx.fillStyle="#f5d58d";

  const numberTexture=new THREE.CanvasTexture(labelCanvas);

}

/* 8. 鼠标、触摸、缩放 */

let targetRotation=0;
let currentRotation=0;
let dragging=false;
let moved=false;
let downX=0,downY=0,lastX=0,lastY=0;
let cameraDistance=17;
let lastPinch=0;

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener("pointerdown",e=>{
  dragging=true;
  moved=false;
  downX=lastX=e.clientX;
  downY=lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove",e=>{
  if(!dragging)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>8){
    moved=true;
  }

  targetRotation+=dx*.008;
  camera.position.y=Math.max(1,Math.min(10,camera.position.y+dy*.012));

  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener("pointerup",e=>{
  dragging=false;

  if(!moved){
    const rect=renderer.domElement.getBoundingClientRect();

    pointer.x=(e.clientX-rect.left)/rect.width*2-1;
    pointer.y=-(e.clientY-rect.top)/rect.height*2+1;

    raycaster.setFromCamera(pointer,camera);

    const hits=raycaster.intersectObjects(giftObjects,true);

    if(hits.length){
      let obj=hits[0].object;

      while(obj&&obj.userData.giftIndex===undefined){
        obj=obj.parent;
      }

      if(obj)openGift(obj.userData.giftIndex);
    }
  }
});

renderer.domElement.addEventListener("pointercancel",()=>{
  dragging=false;
});

renderer.domElement.addEventListener("wheel",e=>{
  cameraDistance=Math.max(12,Math.min(25,cameraDistance+e.deltaY*.012));
},{passive:true});

renderer.domElement.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const distance=Math.hypot(dx,dy);

    if(lastPinch){
      cameraDistance=Math.max(
        12,
        Math.min(25,cameraDistance+(lastPinch-distance)*.025)
      );
    }

    lastPinch=distance;
  }
},{passive:true});

renderer.domElement.addEventListener("touchend",()=>{
  lastPinch=0;
});

const modal=document.getElementById("modal");

/* 10. 保存照片到手机 */

const savePhotoBtn=document.getElementById("savePhotoBtn");
const saveHint=document.getElementById("saveHint");

savePhotoBtn.onclick=async()=>{
  const data=giftsData[selectedGift];

  if(!data)return;

  savePhotoBtn.disabled=true;
  savePhotoBtn.textContent="사진을 준비하고 있어요...";

  try{
    const response=await fetch(data.image);

    if(!response.ok){
      throw new Error("Photo could not be loaded");
    }

    const blob=await response.blob();

    const file=new File(
      [blob],
      "Christmas-Gift-"+(selectedGift+1)+".jpg",
      {type:blob.type||"image/jpeg"}
    );

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){
      await navigator.share({
        files:[file],
        title:"My Christmas Gift",
        text:"A little Christmas gift for you ♡"
      });

      saveHint.textContent="선물 사진을 공유하거나 저장해 주세요 ♡";

    }else{
      const objectURL=URL.createObjectURL(blob);
      const link=document.createElement("a");

      link.href=objectURL;
      link.download="Christmas-Gift-"+(selectedGift+1)+".jpg";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(()=>{
        URL.revokeObjectURL(objectURL);
      },10000);

      saveHint.textContent=
        "사진을 다운로드했어요! 휴대폰의 다운로드 폴더를 확인해 주세요.";
    }

  }catch(error){
    if(error.name==="AbortError"){
      saveHint.textContent="저장이 취소되었어요. 다시 시도할 수 있어요.";
    }else{
      console.error("照片保存失败:",error);

      try{
        const response=await fetch(data.image);
        if(!response.ok)throw new Error("Image unavailable");

        const blob=await response.blob();
        const url=URL.createObjectURL(blob);
        window.open(url,"_blank");

        setTimeout(()=>{
          URL.revokeObjectURL(url);
        },60000);

        saveHint.textContent=
          "사진을 길게 누른 후 휴대폰에 저장해 주세요 ♡";

      }catch(fallbackError){
        saveHint.textContent=
          "사진을 저장할 수 없어요. 인터넷 연결을 확인해 주세요.";
      }
    }

  }finally{
    savePhotoBtn.disabled=false;
    savePhotoBtn.textContent="↓ 사진을 휴대폰에 저장하기";
  }
};

/* 13. 摄像头手势识别 */

let handLandmarker=null;
let cameraStream=null;
let handActive=false;
let detecting=false;

const cameraBtn=document.getElementById("cameraBtn");
const cameraVideo=document.getElementById("cameraVideo");

cameraBtn.onclick=async()=>{
  const status=document.getElementById("status");

  if(handActive){
    handActive=false;
    detecting=false;

    if(cameraStream){
      cameraStream.getTracks().forEach(t=>t.stop());
      cameraStream=null;
    }

    cameraVideo.srcObject=null;
    cameraBtn.textContent="◎ 손동작 켜기";
    status.textContent="손동작 인식이 꺼졌어요";
    return;
  }

  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Camera API is not available");
    }

    status.textContent="손동작 인식 기능을 불러오는 중이에요…";

    const vision=await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
    );

    const fileset=await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    handLandmarker=await vision.HandLandmarker.createFromOptions(fileset,{
      baseOptions:{
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"CPU"
      },
      runningMode:"VIDEO",
      numHands:1
    });

    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:640,height:480},
      audio:false
    });

    cameraVideo.srcObject=cameraStream;
    await cameraVideo.play();

    handActive=true;
    detecting=false;

    cameraBtn.textContent="◎ 손동작 끄기";
    status.textContent="손바닥을 펴면 입자가 흩어지고 주먹을 쥐면 모여요";

    detectHands();

  }catch(error){
    if(cameraStream){
      cameraStream.getTracks().forEach(t=>t.stop());
      cameraStream=null;
    }

    cameraVideo.srcObject=null;
    handActive=false;
    cameraBtn.textContent="◎ 손동작 켜기";

    status.textContent="카메라를 사용할 수 없어요. 브라우저 권한을 확인해 주세요.";
    console.error(error);
  }
};

function detectHands(){
  if(!handActive||!handLandmarker||detecting)return;
  detecting=true;

  function loop(){
    if(!handActive){
      detecting=false;
      return;
    }

    if(cameraVideo.readyState>=2){
      try{
        const result=handLandmarker.detectForVideo(
          cameraVideo,
          performance.now()
        );

        if(result.landmarks&&result.landmarks.length){
          const hand=result.landmarks[0];
          const tips=[8,12,16,20];
          const bases=[5,9,13,17];
          let extended=0;

          for(let i=0;i<4;i++){
            const tip=hand[tips[i]];
            const base=hand[bases[i]];
            const wrist=hand[0];

            if(
              Math.hypot(tip.x-wrist.x,tip.y-wrist.y)>
              Math.hypot(base.x-wrist.x,base.y-wrist.y)*1.18
            ){
              extended++;
            }
          }

          if(extended>=3){
            scattered=true;
            document.getElementById("scatterBtn").textContent="✧ 입자 모으기";
          }else if(extended<=1){
            scattered=false;
            document.getElementById("scatterBtn").textContent="✧ 입자 흩뿌리기";
          }
        }
      }catch(e){
        console.warn("Hand tracking error:",e);
      }
    }

    requestAnimationFrame(loop);
  }

  loop();
}

/* 15. 动画 */

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  if(!dragging)targetRotation+=.0017;

  currentRotation+=(targetRotation-currentRotation)*.06;
  tree.rotation.y=currentRotation;
  dust.rotation.y=-currentRotation*.7;

  camera.position.z+=(cameraDistance-camera.position.z)*.06;
  camera.lookAt(0,4.8,0);

  star.rotation.z=Math.sin(t*1.2)*.08;
  star.scale.setScalar(1+Math.sin(t*2.4)*.07);
  starGlow.intensity=28+Math.sin(t*3)*10;

  snowData.forEach((data,i)=>{
    const flake=snowGroup.children[i];

    flake.position.y-=data.speed;
    flake.position.x+=Math.sin(t*.8+data.phase)*data.drift;
    flake.material.rotation+=data.spin;

    if(flake.position.y<-2){
      flake.position.y=20+Math.random()*5;
      flake.position.x=(Math.random()-.5)*25;
      flake.position.z=(Math.random()-.5)*18;
    }
  });

  const target=scattered?1:0;
  particleMix+=(target-particleMix)*.035;

  const p=treeGeometry.attributes.position.array;

  for(let i=0;i<particleCount;i++){
    const k=i*3;

    p[k]=treePositions[k]+
      (scatteredPositions[k]-treePositions[k])*particleMix;

    p[k+1]=treePositions[k+1]+
      (scatteredPositions[k+1]-treePositions[k+1])*particleMix;

    p[k+2]=treePositions[k+2]+
      (scatteredPositions[k+2]-treePositions[k+2])*particleMix;
  }

  treeGeometry.attributes.position.needsUpdate=true;
  treeMaterial.size=.052+Math.sin(t*2)*.006;

  giftObjects.forEach((gift,i)=>{
    gift.position.y=.08+Math.sin(t*1.4+i*1.3)*.025;

    const targetAngle=gift.userData.open?-1.5:0;

    gift.userData.lid.rotation.x+=
      (targetAngle-gift.userData.lid.rotation.x)*.06;
  });

  groundRing.rotation.z=t*.05;

  renderer.render(scene,camera);
}

animate();
